<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparador de tarifas eléctricas</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f5f5f0;
    --bg-tertiary: #ededea;
    --text-primary: #1a1a18;
    --text-secondary: #6b6b66;
    --text-tertiary: #9a9a94;
    --border-light: rgba(0,0,0,0.12);
    --border-mid: rgba(0,0,0,0.22);
    --radius-md: 8px;
    --radius-lg: 12px;
    --blue: #185FA5;
    --blue-bg: #E6F1FB;
    --blue-text: #0C447C;
    --green-text: #3B6D11;
    --red-text: #A32D2D;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #1e1e1c;
      --bg-secondary: #2a2a28;
      --bg-tertiary: #333330;
      --text-primary: #f0f0ec;
      --text-secondary: #a0a09a;
      --text-tertiary: #6a6a64;
      --border-light: rgba(255,255,255,0.10);
      --border-mid: rgba(255,255,255,0.20);
      --blue-bg: #0c2f52;
      --blue-text: #85B7EB;
      --green-text: #97C459;
      --red-text: #F09595;
    }
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    padding: 1rem;
    min-height: 100vh;
  }
  h1 { font-size: 18px; font-weight: 500; margin-bottom: 1rem; }
  .card {
    background: var(--bg-primary);
    border: 0.5px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 1rem;
    margin-bottom: 0.75rem;
  }
  .section-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
  }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  @media (max-width: 480px) { .grid3 { grid-template-columns: 1fr 1fr; } }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--text-secondary); }
  .field input {
    width: 100%;
    padding: 9px 10px;
    font-size: 14px;
    border: 0.5px solid var(--border-mid);
    border-radius: var(--radius-md);
    background: var(--bg-primary);
    color: var(--text-primary);
    -webkit-appearance: none;
  }
  .field input:focus { outline: none; border-color: var(--blue); }
  .note { font-size: 11px; color: var(--text-tertiary); margin-top: 8px; line-height: 1.5; }
  .sep { height: 0.5px; background: var(--border-light); margin: 1rem 0; }
  .operator-card {
    background: var(--bg-primary);
    border: 0.5px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 0.875rem 1rem;
    margin-bottom: 10px;
  }
  .operator-card.best-card { border: 2px solid var(--blue); }
  .op-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .op-name-input {
    flex: 1;
    padding: 9px 10px;
    font-size: 14px;
    font-weight: 500;
    border: 0.5px solid var(--border-mid);
    border-radius: var(--radius-md);
    background: var(--bg-secondary);
    color: var(--text-primary);
    -webkit-appearance: none;
    min-width: 0;
  }
  .op-name-input:focus { outline: none; border-color: var(--blue); }
  .del-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 20px;
    padding: 6px 8px;
    border-radius: var(--radius-md);
    line-height: 1;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .del-btn:active { background: #FCEBEB; color: var(--red-text); }
  @media (hover: hover) { .del-btn:hover { background: #FCEBEB; color: var(--red-text); } }

  /* Energía: 3 cols siempre; potencia: 2 cols, en fila separada */
  .prices-energy { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .prices-power  { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }

  .subfield { display: flex; flex-direction: column; gap: 3px; }
  .subfield label { font-size: 11px; color: var(--text-tertiary); }
  .subfield input {
    padding: 7px 8px;
    font-size: 13px;
    border: 0.5px solid var(--border-light);
    border-radius: var(--radius-md);
    background: var(--bg-primary);
    color: var(--text-primary);
    width: 100%;
    -webkit-appearance: none;
  }
  .subfield input:focus { outline: none; border-color: var(--blue); }

  /* Desglose en líneas separadas en móvil */
  .op-detail {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 10px;
    line-height: 1.9;
    display: flex;
    flex-wrap: wrap;
    gap: 2px 6px;
  }
  .op-detail .detail-block { white-space: nowrap; }

  .op-total {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 0.5px solid var(--border-light);
  }
  .op-total-label { font-size: 12px; color: var(--text-secondary); }
  .op-total-val { font-size: 24px; font-weight: 500; }
  .op-saving { font-size: 12px; margin-top: 2px; text-align: right; }
  .current-badge {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: var(--radius-md);
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    font-weight: 500;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .best-badge {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: var(--radius-md);
    background: var(--blue-bg);
    color: var(--blue-text);
    font-weight: 500;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .add-btn {
    width: 100%;
    padding: 13px;
    border: 0.5px dashed var(--border-mid);
    border-radius: var(--radius-lg);
    background: none;
    color: var(--text-secondary);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    -webkit-tap-highlight-color: transparent;
  }
  .add-btn:active { background: var(--bg-secondary); }
  @media (hover: hover) { .add-btn:hover { background: var(--bg-secondary); } }
  .sublabel {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 10px 0 5px;
  }
</style>
</head>
<body>

<h1>Comparador de tarifas eléctricas</h1>

<div class="card">
  <div class="section-label">Consumo del periodo (kWh)</div>
  <div class="grid3">
    <div class="field"><label>Punta (P1)</label><input type="number" id="kwh_p1" value="80.87" step="0.01" min="0" inputmode="decimal"></div>
    <div class="field"><label>Llano (P2)</label><input type="number" id="kwh_p2" value="90.89" step="0.01" min="0" inputmode="decimal"></div>
    <div class="field"><label>Valle (P3)</label><input type="number" id="kwh_p3" value="513.75" step="0.01" min="0" inputmode="decimal"></div>
  </div>
</div>

<div class="card">
  <div class="section-label">Potencia contratada y días</div>
  <div class="grid3">
    <div class="field"><label>Potencia P1 (kW)</label><input type="number" id="pot_p1" value="5.5" step="0.01" min="0" inputmode="decimal"></div>
    <div class="field"><label>Potencia P2 (kW)</label><input type="number" id="pot_p2" value="5.5" step="0.01" min="0" inputmode="decimal"></div>
    <div class="field"><label>Días del periodo</label><input type="number" id="dias" value="30" step="1" min="1" inputmode="numeric"></div>
  </div>
  <p class="note">Si la tarifa usa una sola potencia para ambos periodos, introduce el mismo valor en P1 y P2.</p>
</div>

<div class="sep"></div>

<div id="operators-container"></div>
<button class="add-btn" onclick="addOperator()">
  <i class="ti ti-plus"></i> Añadir operadora
</button>

<script>
const PRESETS = [
  {name:'Octopus 3 (actual)',           ep1:0.193,  ep2:0.107,  ep3:0.088,  pp1:0.0930, pp2:0.0930},
  {name:'Octopus 3 (renovación jul-26)',ep1:0.212,  ep2:0.133,  ep3:0.127,  pp1:0.0900, pp2:0.0900},
  {name:'Naturgy — Tarifa Noche',        ep1:0.1822, ep2:0.1092, ep3:0.0739, pp1:0.1230, pp2:0.0616},
  {name:'Imagina — Plan Noche y Findes', ep1:0.225,  ep2:0.132,  ep3:0.088,  pp1:0.1290, pp2:0.0280},
  {name:'Gana Energía — Tramos Horarios',ep1:0.171,  ep2:0.104,  ep3:0.080,  pp1:0.0894, pp2:0.0894},
];

let ops = [];
let opId = 0;

function getConsumption() {
  return {
    kwh_p1: parseFloat(document.getElementById('kwh_p1').value) || 0,
    kwh_p2: parseFloat(document.getElementById('kwh_p2').value) || 0,
    kwh_p3: parseFloat(document.getElementById('kwh_p3').value) || 0,
    pot_p1: parseFloat(document.getElementById('pot_p1').value) || 0,
    pot_p2: parseFloat(document.getElementById('pot_p2').value) || 0,
    dias:   parseFloat(document.getElementById('dias').value)   || 30,
  };
}

function calcTotal(c, op) {
  const e_p1 = c.kwh_p1 * op.ep1;
  const e_p2 = c.kwh_p2 * op.ep2;
  const e_p3 = c.kwh_p3 * op.ep3;
  const pot1 = c.pot_p1 * op.pp1 * c.dias;
  const pot2 = c.pot_p2 * op.pp2 * c.dias;
  const energia  = e_p1 + e_p2 + e_p3;
  const potencia = pot1 + pot2;
  return { total: energia + potencia, energia, potencia, e_p1, e_p2, e_p3, pot1, pot2 };
}

function fmt(n)  { return n.toFixed(2); }
function fmtE(n) { return n.toFixed(4); }

function addOperator(preset, isCurrent) {
  const id = ++opId;
  const p = preset || { name:'Nueva operadora', ep1:0, ep2:0, ep3:0, pp1:0, pp2:0 };
  ops.push({ id, current: !!isCurrent, ...p });
  renderOperators();
}

function removeOperator(id) {
  ops = ops.filter(o => o.id !== id);
  renderOperators();
}

function updateName(id, val) {
  const op = ops.find(o => o.id === id);
  if (op) op.name = val;
}

function updatePrice(id, field, val) {
  const op = ops.find(o => o.id === id);
  if (op) { op[field] = parseFloat(val) || 0; renderOperators(); }
}

function renderOperators() {
  const c = getConsumption();
  const results = ops.map(op => ({ id: op.id, res: calcTotal(c, op) }));
  const bestId  = results.length ? results.reduce((a, b) => a.res.total < b.res.total ? a : b).id : null;

  // Current operator first, rest sorted by ascending total
  const current = ops.filter(o => o.current);
  const rest    = ops.filter(o => !o.current)
                     .slice()
                     .sort((a, b) => results.find(r => r.id === a.id).res.total
                                   - results.find(r => r.id === b.id).res.total);
  const sorted  = [...current, ...rest];
  const refVal  = current.length ? results.find(r => r.id === current[0].id).res.total : null;

  const container = document.getElementById('operators-container');
  container.innerHTML = '';

  sorted.forEach(op => {
    const res    = results.find(r => r.id === op.id).res;
    const isBest = op.id === bestId && ops.length > 1;
    const diff   = refVal !== null && !op.current ? res.total - refVal : null;

    const card = document.createElement('div');
    card.className = 'operator-card' + (isBest ? ' best-card' : '');

    card.innerHTML = `
      <div class="op-header">
        <input class="op-name-input" type="text" value="${op.name.replace(/"/g,'&quot;')}"
          placeholder="Nombre operadora" oninput="updateName(${op.id}, this.value)">
        ${op.current ? '<span class="current-badge">Actual</span>' : ''}
        ${isBest ? '<span class="best-badge">Más barata</span>' : ''}
        <button class="del-btn" onclick="removeOperator(${op.id})" title="Eliminar">
          <i class="ti ti-x"></i>
        </button>
      </div>

      <div class="sublabel">Energía (€/kWh · IVA incluido)</div>
      <div class="prices-energy">
        <div class="subfield"><label>Punta P1</label>
          <input type="number" value="${fmtE(op.ep1)}" step="0.0001" min="0" inputmode="decimal"
            oninput="updatePrice(${op.id},'ep1',this.value)"></div>
        <div class="subfield"><label>Llano P2</label>
          <input type="number" value="${fmtE(op.ep2)}" step="0.0001" min="0" inputmode="decimal"
            oninput="updatePrice(${op.id},'ep2',this.value)"></div>
        <div class="subfield"><label>Valle P3</label>
          <input type="number" value="${fmtE(op.ep3)}" step="0.0001" min="0" inputmode="decimal"
            oninput="updatePrice(${op.id},'ep3',this.value)"></div>
      </div>

      <div class="sublabel">Potencia (€/kW·día)</div>
      <div class="prices-power">
        <div class="subfield"><label>Pot P1</label>
          <input type="number" value="${fmtE(op.pp1)}" step="0.0001" min="0" inputmode="decimal"
            oninput="updatePrice(${op.id},'pp1',this.value)"></div>
        <div class="subfield"><label>Pot P2</label>
          <input type="number" value="${fmtE(op.pp2)}" step="0.0001" min="0" inputmode="decimal"
            oninput="updatePrice(${op.id},'pp2',this.value)"></div>
      </div>

      <div class="op-detail">
        <span class="detail-block">P1 ${fmt(res.e_p1)} €</span>
        <span class="detail-block">+ P2 ${fmt(res.e_p2)} €</span>
        <span class="detail-block">+ P3 ${fmt(res.e_p3)} €</span>
        <span class="detail-block">= <strong>${fmt(res.energia)} €</strong></span>
        &nbsp;&nbsp;
        <span class="detail-block">Pot P1 ${fmt(res.pot1)} €</span>
        <span class="detail-block">+ P2 ${fmt(res.pot2)} €</span>
        <span class="detail-block">= <strong>${fmt(res.potencia)} €</strong></span>
      </div>

      <div class="op-total">
        <span class="op-total-label">Total estimado</span>
        <div style="text-align:right;">
          <div class="op-total-val" style="color:${isBest ? 'var(--blue)' : 'var(--text-primary)'}">
            ${fmt(res.total)} €
          </div>
          ${diff !== null
            ? `<div class="op-saving" style="color:${diff > 0 ? 'var(--red-text)' : 'var(--green-text)'}">
                ${diff > 0 ? '▲ +' : '▼ '}${fmt(diff)} € vs. primera
               </div>`
            : ''}
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

['kwh_p1','kwh_p2','kwh_p3','pot_p1','pot_p2','dias'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderOperators);
});

PRESETS.forEach((p, i) => addOperator(p, i === 0));
</script>
</body>
</html>
